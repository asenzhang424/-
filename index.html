<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101115"><title>人物姿态图 — SHISEI ARCHIVE</title>
<style>
:root{color-scheme:dark;--bg:#101115;--panel:#1a1c21;--line:#30333a;--text:#f1f1f0;--muted:#999ba4;--accent:#d7f079}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:32px clamp(18px,4vw,64px) 20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:700}h1{font-size:clamp(32px,5vw,64px);letter-spacing:-.05em;line-height:1.1;margin:12px 0}header p{color:var(--muted);margin:0;max-width:680px}.wrap{padding:22px clamp(18px,4vw,64px) 60px}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}input,select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}input{flex:1;min-width:190px}button{cursor:pointer}button.active{background:var(--accent);color:#16191a;border-color:var(--accent);font-weight:700}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 24px}.meta{display:flex;justify-content:space-between;gap:15px;color:var(--muted);margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel);cursor:pointer;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px);border-color:#7a8257}.thumb{aspect-ratio:3/4;background:#e6e4df;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:contain}.card .info{padding:10px 12px}.card strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:var(--muted)}.tag{float:right;color:var(--accent)}dialog{background:#17191d;border:1px solid #444750;border-radius:17px;color:var(--text);width:min(1050px,95vw);max-height:92vh;padding:0}dialog::backdrop{background:#000b}.modalHead{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modalBody{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,.8fr);gap:22px;padding:20px}.big{background:#e6e4df;border-radius:12px;min-height:330px;display:flex;align-items:center;justify-content:center}.big img{max-width:100%;max-height:65vh;object-fit:contain}.angles{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.detail p{color:var(--muted)}a{color:var(--accent)}.footer{margin-top:30px;color:var(--muted);font-size:12px}#status{color:var(--muted)}@media(max-width:650px){.modalBody{grid-template-columns:1fr}.big{min-height:260px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card .info{padding:8px}header{padding-top:24px}}
</style></head><body><header><div class="eyebrow">POSE REFERENCE / SHISEI ARCHIVE</div><h1>人物姿态图<span style="color:var(--accent)">.</span></h1><p>人体结构与动作参考图库 · 官方 Shisei 线稿 · 按姿势分类 · 多角度查看 · 适用于角色建模、绘画和 AI 图像参考</p></header>
<main class="wrap"><div class="tools"><input id="search" placeholder="搜索姿势名称、编号，例如：坐姿 / P001"><select id="series"><option value="all">全部系列</option><option value="std">标准全身</option><option value="upper">上半身</option><option value="sexy">风格化姿势</option><option value="duo">双人姿势</option></select><select id="angle"><option value="front">正面</option><option value="diag">斜侧</option><option value="side">侧面</option><option value="above">俯视</option><option value="below">仰视</option></select></div><div class="chips" id="chips"></div><div class="meta"><span id="status">正在载入官方姿势目录…</span><span>SHISEI / CC0</span></div><div class="grid" id="grid"></div><div class="footer">图片与动作数据来源：<a href="https://github.com/wquguru/shisei" target="_blank" rel="noopener">wquguru/shisei</a> · 图片遵循 CC0 授权 · 本站为个人整理的非官方浏览界面</div></main>
<dialog id="viewer"><div class="modalHead"><strong id="vtitle"></strong><button id="close">关闭 ×</button></div><div class="modalBody"><div class="big"><img id="vimg" alt="人体姿态线稿"></div><div class="detail"><div class="eyebrow" id="vid"></div><h2 id="vname"></h2><p id="vdesc"></p><div>查看角度</div><div class="angles" id="angles"></div><p><a id="original" target="_blank" rel="noopener">打开原图 ↗</a></p><p><button id="copy">复制图片链接</button></p><p style="font-size:12px">图片直接读取 Shisei 官方仓库；仅显示原项目存在的角度。</p></div></div></dialog>
<script>
const BASE='https://raw.githubusercontent.com/wquguru/shisei/main/';const ANG={front:'正面',diag:'斜侧',side:'侧面',above:'俯视',below:'仰视'};const GROUPS=['全部','站姿','坐姿','跪姿','躺姿','蹲姿','扭转','动态','上半身','双人','其他'];let all=[],group='全部',selected=null,selAngle='front';
const $=id=>document.getElementById(id);const imgUrl=(p,a)=>BASE+'images/line/w900/'+p.views[a];const cls=p=>{let s=(p.class_cn||'')+' '+(p.name_cn||'');if(p.series==='duo')return '双人';if(p.series==='upper')return '上半身';if(/站立|站姿|站着/.test(s))return '站姿';if(/坐|坐姿/.test(s))return '坐姿';if(/跪|四足/.test(s))return '跪姿';if(/躺|卧|仰卧|侧卧/.test(s))return '躺姿';if(/蹲/.test(s))return '蹲姿';if(/扭/.test(s))return '扭转';if(/前倾|后仰|弓|弯/.test(s))return '动态';return '其他'};
function chips(){const counts={};for(const p of all){const c=cls(p);counts[c]=(counts[c]||0)+1} $('chips').innerHTML='';for(const c of GROUPS){const b=document.createElement('button');b.textContent=c+(c==='全部'?'':(' · '+(counts[c]||0)));b.className=c===group?'active':'';b.onclick=()=>{group=c;chips();render()};$('chips').append(b)}}
function render(){const q=$('search').value.trim().toLowerCase(),s=$('series').value,a=$('angle').value;let arr=all.filter(p=>(group==='全部'||cls(p)===group)&&(s==='all'||p.series===s)&&(!q||[p.id,p.name_cn,p.name_en,p.class_cn,p.desc_en].join(' ').toLowerCase().includes(q)));$('status').textContent='共 '+arr.length+' 个姿势 · 官方目录 '+all.length+' 个';$('grid').innerHTML='';const frag=document.createDocumentFragment();for(const p of arr){const angle=p.views[a]?a:Object.keys(p.views).find(k=>p.views[k]);if(!angle)continue;const card=document.createElement('article');card.className='card';const thumb=document.createElement('div');thumb.className='thumb';const img=document.createElement('img');img.loading='lazy';img.src=imgUrl(p,angle).replace('/w900/','/w300/');img.alt=p.name_cn||p.id;thumb.append(img);const info=document.createElement('div');info.className='info';const title=document.createElement('strong');title.textContent=p.name_cn||p.name_en||p.id;const small=document.createElement('small');small.textContent=p.id+' · '+cls(p);info.append(title,small);card.append(thumb,info);card.onclick=()=>openPose(p,angle);frag.append(card)}$('grid').append(frag)}
function setAngle(a){if(!selected||!selected.views[a])return;selAngle=a;$('vimg').src=imgUrl(selected,a);$('original').href=imgUrl(selected,a);$('angles').innerHTML='';for(const k of Object.keys(ANG)){if(!selected.views[k])continue;const b=document.createElement('button');b.textContent=ANG[k];b.className=k===a?'active':'';b.onclick=()=>setAngle(k);$('angles').append(b)}}
function openPose(p,a){selected=p;$('vtitle').textContent=p.id+' / '+cls(p);$('vid').textContent=p.series.toUpperCase()+' / '+p.id;$('vname').textContent=p.name_cn||p.name_en;$('vdesc').textContent=p.desc_en||'';setAngle(a);$('viewer').showModal()}
$('close').onclick=()=>$('viewer').close();$('viewer').onclick=e=>{if(e.target===$('viewer'))$('viewer').close()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('original').href);$('copy').textContent='已复制 ✓';setTimeout(()=>$('copy').textContent='复制图片链接',1500)}catch(e){prompt('复制链接：',$('original').href)}};
$('search').oninput=render;$('series').onchange=render;$('angle').onchange=render;
fetch(BASE+'data/catalog.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{all=d.filter(p=>p.views&&Object.values(p.views).some(Boolean));chips();render()}).catch(e=>{$('status').textContent='目录加载失败，请检查网络或稍后重试：'+e.message});
</script></body></html>
